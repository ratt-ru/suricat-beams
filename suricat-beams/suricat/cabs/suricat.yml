lib:
  misc:
    suricat:
      base-url: https://public-data.ratt.center/MeerKATbeams/
      # common options for breifast cab can set en masse here
      cabs:
        image:
          registry: quay.io/osmirnov
          name: suricat
          version: sc0.2.0

cabs:
  suricat.download-mdv-beams:
    _use: lib.misc.suricat.cabs
    info: Downloads MdV-format primary beams from SARAO archive
    command: suricat.beams.download_mdv_beams
    flavour: python
    inputs:
      source: 
        dtype: str
        info: full URL, or filename (e.g. MeerKAT_U_band_primary_beam.npz), or band (e.g. U)
        required: true
        policies:
          positional: true
        metavar: BAND
      base-url:
        info: download locations (mirrors), multiple may be given
        dtype: List[str]
        default:
          - https://ratt-public-data.s3.af-south-1.amazonaws.com/MeerKATbeams/
          - https://archive-gw-1.kat.ac.za/public/repository/10.48479/wdb0-h061/data/
        policies:
          repeat: repeat
        metavar: URL
    outputs:
      dest: 
        dtype: File
        info: destination file, default uses filename from URL
        required: false
        policies:
          positional: true
        metavar: "[DESTINATION]"

  suricat.mdv-beams-to-bds:
    _use: lib.misc.suricat.cabs
    command: suricat.beams.mdv_beams_to_bds
    info: Converts MdV-format primary beams to a beam dataset (BDS)
    flavour: python
    inputs:
      mdv-beams:
        dtype: File
        metavar: MDV_FILE
        info: input MdV beams npz file (see https://doi.org/10.48479/wdb0-h061)
        required: true
        policies:
          positional: true
      compress:
        dtype: bool
        info: apply Delta+Blosc compression to zarr output
        default: false
    outputs:
      bds:
        dtype: Directory
        metavar: BDS_FILE
        info: output beam dataset (BDS) file
        mkdir: false
        policies:
          positional: true

  suricat.bds-to-xradio:
    _use: lib.misc.suricat.cabs
    command: suricat.xradio_util.bds_to_xradio
    info: Renders a beam dataset (BDS) to an xradio-compatible zarr image
    flavour: python
    inputs:
      bds-path:
        dtype: Directory
        metavar: BDS_PATH
        info: input beam dataset (.bds.zarr)
        required: true
        policies:
          positional: true
      image-path:
        dtype: Directory
        metavar: IMAGE_PATH
        info: image/dataset for WCS and time info
        required: true
        policies:
          positional: true
      output-var:
        dtype: str
        info: name of the output data variable
        default: SKY
      pixel-stepping:
        dtype: int
        info: compute every Nth pixel, interpolate back
        default: 4
      time-stepping:
        dtype: int
        info: use every Nth timeslot
        default: 1
      num-freq:
        dtype: int
        info: number of frequency channels (default uses beam dataset freqs)
      ncpu:
        dtype: int
        info: number of CPUs (default auto)
      chunks-time:
        dtype: int
        info: zarr chunk size along time axis
        default: 1
      chunks-freq:
        dtype: int
        info: zarr chunk size along frequency axis
      chunks-x:
        dtype: int
        info: zarr chunk size along l axis
        default: 256
      chunks-y:
        dtype: int
        info: zarr chunk size along m axis
        default: 256
      elements:
        dtype: List[str]
        info: "Jones/Mueller elements to render (e.g. II, QQ for Stokes; XX, YY for Jones)"
        policies:
          repeat: repeat
      output-pol:
        dtype: List[str]
        info: "output polarization labels for each element (default: auto)"
        policies:
          repeat: repeat
      beam-type:
        dtype: str
        info: beam variable to use (nstokes, stokes, njones, jones)
        default: nstokes
      compress:
        dtype: bool
        info: apply Delta+Blosc compression to zarr output
        default: false
    outputs:
      output:
        dtype: Directory
        metavar: OUTPUT
        info: output xradio zarr dataset
        mkdir: false
        policies:
          positional: true

  suricat.mdv-to-xradio:
    _use: lib.misc.suricat.cabs
    command: suricat.xradio_util.mdv_to_xradio
    info: Converts raw MdV beam npz to an xradio-compatible zarr image
    flavour: python
    inputs:
      npz-path:
        dtype: File
        metavar: NPZ_PATH
        info: input MdV beam npz file
        required: true
        policies:
          positional: true
      antenna:
        dtype: int
        info: antenna index (-1 = array_average)
        default: -1
      jones:
        dtype: str
        info: Jones element (HH, HV, VH, VV)
        default: HH
      part:
        dtype: str
        info: component to render (real, imag, abs, phase)
        default: real
      output-var:
        dtype: str
        info: data variable name
        default: SKY
      chunks-freq:
        dtype: int
        info: zarr chunk size along frequency axis
        default: 64
      chunks-x:
        dtype: int
        info: zarr chunk size along l axis
        default: 128
      chunks-y:
        dtype: int
        info: zarr chunk size along m axis
        default: 128
      compress:
        dtype: bool
        info: apply Delta+Blosc compression to zarr output
        default: false
    outputs:
      output:
        dtype: Directory
        metavar: OUTPUT
        info: output xradio zarr dataset
        mkdir: false
        policies:
          positional: true

